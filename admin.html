<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toán Tiểu Học — Admin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1020; color: #e8e8f5; max-width: 760px; margin: 0 auto;
      padding: 32px 20px; line-height: 1.5;
    }
    h1 { color: #8b7dff; font-size: 1.4rem; }
    .row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    input {
      flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #333; background: #1a1b2e; color: #fff; font-size: 0.95rem;
    }
    button {
      padding: 10px 20px; border: 0; border-radius: 10px; background: #6B5DE0;
      color: #fff; font-weight: 600; cursor: pointer; font-size: 0.95rem;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-top: 20px;
    }
    .card {
      background: #1a1b2e; border: 1px solid #2a2b45; border-radius: 14px;
      padding: 16px 18px;
    }
    .card .label { color: #9a9ac0; font-size: 0.8rem; }
    .card .value { font-size: 1.9rem; font-weight: 700; margin-top: 4px; }
    .muted { color: #7a7a9a; font-size: 0.85rem; margin-top: 20px; }
    .err { color: #ff8080; margin-top: 12px; }
    .section-title { color: #9a9ac0; font-size: 0.85rem; margin: 24px 0 4px; }
  </style>
</head>
<body>
  <h1>Toán Tiểu Học — Bảng điều khiển</h1>
  <div class="row">
    <input id="base" placeholder="API base URL"
      value="https://toancap1-production.up.railway.app" />
  </div>
  <div class="row">
    <input id="token" type="password" placeholder="Admin token (X-Admin-Token)" />
    <button id="load" onclick="load()">Xem số liệu</button>
  </div>
  <div id="err" class="err"></div>

  <div class="section-title">Người dùng</div>
  <div class="grid" id="userGrid"></div>
  <div class="section-title">Học tập</div>
  <div class="grid" id="learnGrid"></div>
  <div class="section-title">Hoạt động 7 ngày</div>
  <div class="grid" id="activeGrid"></div>

  <p class="muted" id="meta"></p>
  <p class="muted">Trang nội bộ. Token lưu tạm trong trình duyệt phiên này, không gửi đi đâu
    ngoài API của bạn.</p>

  <script>
    const $ = id => document.getElementById(id);
    // Nhớ token/base trong sessionStorage cho tiện (chỉ phiên hiện tại).
    $('base').value = sessionStorage.getItem('adminBase') || $('base').value;
    $('token').value = sessionStorage.getItem('adminToken') || '';

    function card(label, value) {
      return `<div class="card"><div class="label">${label}</div>
        <div class="value">${value}</div></div>`;
    }

    async function load() {
      const base = $('base').value.replace(/\/$/, '');
      const token = $('token').value.trim();
      $('err').textContent = '';
      $('load').disabled = true;
      sessionStorage.setItem('adminBase', base);
      sessionStorage.setItem('adminToken', token);
      try {
        const res = await fetch(base + '/api/v1/admin/stats', {
          headers: { 'X-Admin-Token': token }
        });
        if (!res.ok) {
          throw new Error(res.status === 404
            ? 'Sai token hoặc admin chưa bật (404).'
            : 'Lỗi ' + res.status);
        }
        const d = (await res.json()).data;
        $('userGrid').innerHTML =
          card('Tổng người dùng', d.usersTotal) +
          card('Khách (guest)', d.usersGuest) +
          card('Apple', d.usersApple) +
          card('Đang hoạt động', d.usersActive) +
          card('Học sinh', d.students) +
          card('Gói Premium', d.subscriptionsActive);
        $('learnGrid').innerHTML =
          card('Tổng câu trả lời', d.attemptsTotal) +
          card('Câu đúng', d.attemptsCorrect) +
          card('Tỉ lệ đúng', d.attemptsTotal
            ? Math.round(100 * d.attemptsCorrect / d.attemptsTotal) + '%' : '—');
        $('activeGrid').innerHTML =
          card('Học sinh học (7 ngày)', d.activeStudents7d) +
          card('Câu trả lời (7 ngày)', d.attempts7d);
        $('meta').textContent = 'Cập nhật: ' + new Date(d.generatedAt).toLocaleString('vi-VN');
      } catch (e) {
        $('err').textContent = e.message;
      } finally {
        $('load').disabled = false;
      }
    }
    if ($('token').value) load();
  </script>
</body>
</html>
