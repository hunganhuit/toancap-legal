<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toán Tiểu Học — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0c0d1a; --panel: #15172a; --panel2: #1c1e35; --line: #2a2d4a;
      --text: #e9e9f6; --muted: #8f90b5; --accent: #7c6cff; --accent2: #35d0a5;
      --warn: #ffb02e; --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); margin: 0; min-height: 100vh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--panel);
      position: sticky; top: 0; z-index: 10; flex-wrap: wrap; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand .dot { width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input {
      padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel2); color: var(--text); font-size: 0.9rem; min-width: 170px;
    }
    button {
      padding: 9px 18px; border: 0; border-radius: 10px; background: var(--accent);
      color: #fff; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    button:disabled { opacity: .5; cursor: default; }
    main { padding: 24px 28px; max-width: 1100px; margin: 0 auto; }
    .err { color: var(--danger); margin: 12px 0; min-height: 1.2em; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
      gap: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 20px; position: relative; overflow: hidden;
    }
    .card .ico { position: absolute; right: 14px; top: 14px; font-size: 1.3rem; opacity:.5;}
    .card .label { color: var(--muted); font-size: .82rem; }
    .card .value { font-size: 2rem; font-weight: 800; margin-top: 6px; letter-spacing:-.5px;}
    .card .sub { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .accent { color: var(--accent); } .green { color: var(--accent2); }
    h2 { font-size: .95rem; color: var(--muted); margin: 30px 0 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .5px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 20px; }
    .charts { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
    @media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }
    .empty { color: var(--muted); text-align: center; padding: 80px 20px; }
    .meta { color: var(--muted); font-size: .8rem; margin-top: 18px; }
    .pill { font-size:.72rem; padding:3px 9px; border-radius:999px; background:var(--panel2);
      color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> Toán Tiểu Học · Admin</div>
    <div class="controls">
      <input id="base" placeholder="API base URL" />
      <input id="token" type="password" placeholder="Admin token" />
      <button id="load" onclick="load()">Tải</button>
      <span class="pill" id="auto"></span>
    </div>
  </header>
  <main>
    <div class="err" id="err"></div>
    <div id="dash" style="display:none">
      <div class="cards" id="cards"></div>
      <h2>Biểu đồ</h2>
      <div class="charts">
        <div class="panel"><canvas id="trend" height="150"></canvas></div>
        <div class="panel"><canvas id="grade" height="150"></canvas></div>
      </div>
      <p class="meta" id="meta"></p>
    </div>
    <div class="empty" id="empty">Nhập API base + admin token rồi bấm “Tải”.</div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const fmt = n => (n ?? 0).toLocaleString('vi-VN');
    let trendChart, gradeChart, timer;

    $('base').value = sessionStorage.getItem('adminBase')
      || 'https://toancap1-production.up.railway.app';
    $('token').value = sessionStorage.getItem('adminToken') || '';

    function cardHtml(label, value, sub, ico, cls) {
      return `<div class="card"><div class="ico">${ico||''}</div>
        <div class="label">${label}</div>
        <div class="value ${cls||''}">${value}</div>
        <div class="sub">${sub||'&nbsp;'}</div></div>`;
    }

    function render(d) {
      const acc = d.attemptsTotal ? Math.round(100*d.attemptsCorrect/d.attemptsTotal) : 0;
      const perStudent = d.students ? (d.attemptsTotal/d.students).toFixed(1) : '0';
      $('cards').innerHTML =
        cardHtml('Người dùng', fmt(d.usersTotal),
          `${fmt(d.usersApple)} Apple · ${fmt(d.usersGuest)} khách`, '👤') +
        cardHtml('Học sinh', fmt(d.students), `${perStudent} câu/học sinh`, '🎒') +
        cardHtml('Câu đã trả lời', fmt(d.attemptsTotal), `${acc}% đúng`, '✍️','accent') +
        cardHtml('Premium', fmt(d.subscriptionsActive), 'gói đang hoạt động', '⭐','green') +
        cardHtml('Hoạt động 7 ngày', fmt(d.activeStudents7d),
          `${fmt(d.attempts7d)} câu · ${fmt(d.newUsers7d)} user mới`, '🔥') +
        cardHtml('Tỉ lệ đúng', acc + '%', `${fmt(d.attemptsCorrect)} câu đúng`, '🎯','green');

      // Trend line
      const labels = d.dailyAttempts.map(p => p.date.slice(5)); // MM-DD
      const data = d.dailyAttempts.map(p => p.attempts);
      trendChart?.destroy();
      trendChart = new Chart($('trend'), {
        type: 'line',
        data: { labels, datasets: [{ label: 'Câu trả lời / ngày', data,
          borderColor: '#7c6cff', backgroundColor: 'rgba(124,108,255,.15)',
          fill: true, tension: .35, pointRadius: 2 }] },
        options: chartOpts('Xu hướng 14 ngày')
      });

      // Grade bars
      gradeChart?.destroy();
      gradeChart = new Chart($('grade'), {
        type: 'bar',
        data: { labels: d.byGrade.map(g => g.grade.replace('GRADE_','Lớp ')),
          datasets: [{ label: 'Học sinh', data: d.byGrade.map(g => g.students),
            backgroundColor: '#35d0a5', borderRadius: 6 }] },
        options: chartOpts('Học sinh theo lớp')
      });

      $('meta').textContent = 'Cập nhật: '
        + new Date(d.generatedAt).toLocaleString('vi-VN');
    }

    function chartOpts(title) {
      return {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: { display: true, text: title, color: '#8f90b5', font: { size: 12 } }
        },
        scales: {
          x: { ticks: { color: '#8f90b5' }, grid: { color: 'rgba(255,255,255,.04)' } },
          y: { beginAtZero: true, ticks: { color: '#8f90b5', precision: 0 },
            grid: { color: 'rgba(255,255,255,.06)' } }
        }
      };
    }

    async function load() {
      const base = $('base').value.replace(/\/$/, '');
      const token = $('token').value.trim();
      sessionStorage.setItem('adminBase', base);
      sessionStorage.setItem('adminToken', token);
      $('err').textContent = ''; $('load').disabled = true;
      try {
        const res = await fetch(base + '/api/v1/admin/stats',
          { headers: { 'X-Admin-Token': token } });
        if (!res.ok) throw new Error(res.status === 404
          ? 'Sai token hoặc admin chưa bật (set ADMIN_TOKEN trên Railway).'
          : 'Lỗi ' + res.status);
        render((await res.json()).data);
        $('empty').style.display = 'none';
        $('dash').style.display = 'block';
        startAuto();
      } catch (e) {
        $('err').textContent = e.message;
      } finally { $('load').disabled = false; }
    }

    function startAuto() {
      clearInterval(timer);
      timer = setInterval(load, 30000); // tự làm mới mỗi 30s
      $('auto').textContent = 'tự làm mới 30s';
    }

    if ($('token').value) load();
  </script>
</body>
</html>
